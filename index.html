
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witystore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff9df;font-family:Arial,sans-serif;color:#493510}
header{background:#ffda45;padding:35px 15px;text-align:center;border-radius:0 0 35px 35px}
h1{margin:0;font-size:36px}
header p{font-size:12px;font-weight:bold}
main{max-width:900px;margin:auto;padding:20px}
input{width:100%;padding:15px;border:2px solid #ffd54f;border-radius:25px;font-size:16px}
#produk{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;margin-top:20px}
.card{background:white;border:2px solid #ffe38a;border-radius:22px;padding:15px;box-shadow:0 4px 10px #0000000a}
.card img{width:100%;height:130px;object-fit:contain;border-radius:15px}
.card h3{font-size:16px}
.card p{font-size:13px;line-height:1.5}
.harga{font-size:20px;font-weight:bold;color:#a56b00}
footer{text-align:center;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>💛 WITYSTORE</h1>
<p>AMAN • CEPAT • TERPERCAYA</p>
<p>FULL GARANSI 100%</p>
</header>
<main>
<h2>Katalog Produk ✨</h2>
<input id="cari" placeholder="Cari aplikasi premium...">
<div id="produk">Memuat produk...</div>
</main>
<footer>© Witystore | Aplikasi Premium</footer>
<script>
const url = "https://fbrvxonpoqvijrwhjmnt.supabase.co";
const key = "sb_publishable_3xHe531NObIFctWC9L5ERg_hkarVUCy";
let data = [];
const katalog = document.getElementById("produk");

function tampilkan(){
  const cari = document.getElementById("cari").value.toLowerCase();
  katalog.replaceChildren();
  const hasil = data.filter(p =>
    String(p.nama_produk || p.name || "").toLowerCase().includes(cari)
  );
  hasil.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    const img = document.createElement("img");
    img.src = p.gambar_produk || "";
    img.alt = p.nama_produk || p.name;
    const nama = document.createElement("h3");
    nama.textContent = p.nama_produk || p.name;
    const harga = document.createElement("div");
    harga.className = "harga";
    harga.textContent = "Rp" + Number(p.harga).toLocaleString("id-ID");
    const deskripsi = document.createElement("p");
    deskripsi.textContent = p.deskripsi || "";
    const wa = document.createElement("a");
wa.textContent = "💬 Order via WhatsApp";
wa.href = "https://wa.me/62895329351557?text=" + encodeURIComponent("Halo kak, saya mau order " + nama.textContent + " " + harga.textContent);
wa.target = "_blank";
wa.rel = "noopener noreferrer";
wa.style.cssText = "display:block;background:#25D366;color:white;padding:12px;border-radius:12px;text-align:center;text-decoration:none;font-weight:bold;margin-top:12px;";
card.append(img,nama,harga,deskripsi,wa);
    katalog.append(card);
  });
  if(!hasil.length) katalog.textContent = "Produk belum tersedia.";
}

async function muat(){
  try{
    const res = await fetch(url + "/rest/v1/produk?select=*&status=eq.aktif",{
      headers:{apikey:key}
    });
    if(!res.ok) throw new Error("API error");
    data = await res.json();
    tampilkan();
  }catch(e){
    katalog.textContent = "Gagal memuat produk. Periksa koneksi dan pengaturan Supabase.";
  }
}
document.getElementById("cari").addEventListener("input",tampilkan);
muat();
</script>
</body>
</html>
